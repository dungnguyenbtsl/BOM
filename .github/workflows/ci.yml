name: CI

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "assets/**"
      - "tests/**"
      - "package.json"
      - ".github/scripts/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "index.html"
      - "assets/**"
      - "tests/**"
      - "package.json"
      - ".github/scripts/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run repository checks
        run: python3 .github/scripts/validate_repo.py
      - name: Run unit tests
        run: npm test
