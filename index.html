<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>生產用料明細計算表</title>
    <style>
        @page { size: A4 landscape; margin: 8mm; }
        * { box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", Arial, sans-serif; background-color: #fff; margin: 0; padding: 15px; color: #333; }
        
        .page { width: 277mm; min-height: 180mm; padding: 10px 15px; margin: 0 auto; background-color: #fff; position: relative; }
        
        .header-container { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; position: relative; }
        .logo-box { width: 100px; height: 40px; display: flex; align-items: center; justify-content: flex-start; }
        .logo-box img { max-width: 100%; max-height: 40px; object-fit: contain; }
        
        .title-box { flex-grow: 1; text-align: center; }
        h2 { font-size: 18px; margin: 0 0 2px 0; color: #111; }
        .subtitle { font-size: 13px; font-weight: bold; color: #c0392b; margin: 0; }
        
        table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 5px; }
        th, td { border: 1px solid #bbb; padding: 5px 6px; text-align: center; }
        th { background-color: #eaecef; font-weight: bold; color: #222; }
        td.left { text-align: left; }
        td.right { text-align: right; }
        .missing-data { background-color: #fff8e1 !important; color: #856404; font-weight: bold; }
        
        @media print { 
            body { padding: 0; } 
            .page { margin: 0; width: 100%; padding: 0; } 
            .missing-data { -webkit-print-color-adjust: exact; } 
        }
    </style>
</head>
<body>

<div class="page" id="printableArea">
    <div class="header-container">
        <div class="logo-box" id="logoContainer">
            <img src="https://dungnguyenbtsl.github.io/FULIAO-LABEL/logo.jpeg" alt="Logo">
        </div>
        <div class="title-box">
            <h2>生產用料明細計算表</h2>
            <div class="subtitle" id="brandTitle">KEEN</div>
        </div>
        <div style="width: 100px;"></div>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 4%;">項次</th>
                <th style="width: 15%;">工廠型體</th>
                <th style="width: 11%;">料號</th>
                <th style="width: 19%;">材料名稱與規格</th>
                <th style="width: 9%;">顏色</th>
                <th style="width: 10%;">供應商</th>
                <th style="width: 11%;">生產訂單號</th>
                <th style="width: 7%;">數量</th>
                <th style="width: 6%;">單位</th>
                <th style="width: 17%;">部件與用量</th>
                <th style="width: 10%;">總用量</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr><td colspan="11" style="color: #777; padding: 20px;">暫无数据...</td></tr>
        </tbody>
    </table>
</div>

</body>
</html>
