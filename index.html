<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="BOM 生產用料計算工具：從 BOM 與訂單 Excel 計算 SKU 物料需求，並產生可列印及可匯出的報表。">
<meta name="author" content="dungnguyenbtsl">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta name="theme-color" content="#0066cc">
<link rel="canonical" href="https://dungnguyenbtsl.github.io/BOM/">
<link rel="preload" as="image" href="assets/logo.jpeg" type="image/jpeg">
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<meta property="og:type" content="website">
<meta property="og:site_name" content="BOM Production Material Requirement Calculator">
<meta property="og:title" content="BOM 生產用料明細計算表">
<meta property="og:description" content="從 BOM 與訂單 Excel 計算 SKU 物料需求，產生可列印、Excel 及 Word 報表。">
<meta property="og:url" content="https://dungnguyenbtsl.github.io/BOM/">
<meta property="og:image" content="https://dungnguyenbtsl.github.io/BOM/assets/logo.jpeg">
<meta property="og:image:alt" content="BOM production material calculator">
<meta property="og:locale" content="zh_TW">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="BOM 生產用料明細計算表">
<meta name="twitter:description" content="從 BOM 與訂單 Excel 計算 SKU 物料需求，產生可列印、Excel 及 Word 報表。">
<meta name="twitter:image" content="https://dungnguyenbtsl.github.io/BOM/assets/logo.jpeg">
<title>BOM 生產用料明細計算表｜SKU 物料需求報表</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.js" defer></script>
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<h1 class="sr-only" data-i18n="pageHeading">BOM 生產用料明細計算表</h1>
<noscript>
<p data-i18n="noscriptMessage">此工具需要啟用 JavaScript，才能讀取 BOM 與訂單 Excel 檔案並產生物料需求報表。</p>
</noscript>
<div class="control-panel">
<div class="control-item">
<label for="languageSelect"><b data-i18n="languageLabel">語言:</b></label>
<select id="languageSelect" onchange="changeLanguage()" aria-label="Language">
<option value="zh-TW">繁體中文</option>
<option value="vi">Tiếng Việt</option>
<option value="en">English</option>
</select>
</div>
<div class="control-item">
<label for="brandSelect"><b data-i18n="brandLabel">品牌:</b></label>
<select id="brandSelect" onchange="updateBrandTitle()">
<option value="KEEN">KEEN</option>
<option value="SAUCONY">SAUCONY</option>
<option value="KOLON">KOLON</option>
<option value="BLACKYAK">BLACKYAK</option>
<option value="OTHER" data-i18n="otherBrand">其他</option>
</select>
<input type="text" id="customBrandInput" placeholder="輸入品牌" data-i18n-placeholder="customBrandPlaceholder" style="display:none; width:90px;" oninput="updateBrandTitle()">
</div>
<div class="control-item">
<label for="masterFile"><b data-i18n="masterLabel">定額庫 (BOM):</b> <span id="masterStatus" data-i18n="notSelected" style="color:red; font-size:11px;">(未選)</span></label>
<input type="file" id="masterFile" accept=".xlsx, .xls" onchange="loadMasterDB(event)" style="width: 130px;">
</div>
<div class="control-item">
<label for="orderFile"><b data-i18n="orderLabel">訂單文件 (Orders):</b> <span id="orderStatus" data-i18n="notSelected" style="color:red; font-size:11px;">(未選)</span></label>
<input type="file" id="orderFile" accept=".xlsx, .xls" onchange="loadOrderFile(event)" style="width: 130px;">
</div>
<div class="control-item">
<button class="btn" onclick="processOrderList()" data-i18n="generateButton">生成報表</button>
<button class="btn btn-excel" onclick="exportToExcel()" data-i18n="exportExcelButton">導出 Excel</button>
<button class="btn btn-word" onclick="exportToWord()" data-i18n="exportWordButton">導出 Word</button>
<button class="btn btn-success" onclick="window.print()" data-i18n="printButton">打印</button>
</div>
</div>
<section class="export-history" aria-labelledby="exportHistoryTitle">
<div class="export-history-header">
<h2 id="exportHistoryTitle" data-i18n="historyTitle">Lịch sử xuất gần đây</h2>
<button type="button" class="history-clear" onclick="clearExportHistory()" data-i18n="clearHistory">Xóa lịch sử</button>
</div>
<ul id="exportHistoryList" class="export-history-list" aria-live="polite"></ul>
</section>
<!-- Khu vực chứa các trang SKU -->
<div id="pagesContainer">
<div class="page">
<div class="header-container">
<div class="logo-box">
<img src="assets/logo.jpeg" width="100" height="40" alt="BOM company logo" decoding="async">
</div>
<div class="title-box">
<h2 data-i18n="reportTitle">生產用料明細計算表</h2>
<div class="subtitle" id="brandTitle">KEEN</div>
</div>
<div class="sku-title" data-i18n="uploadFiles">請上傳文件</div>
</div>
<div style="color: #777; padding: 30px; text-align: center;" data-i18n="uploadInstruction">請上傳定額庫與訂單文件後點擊「生成報表」...</div>
</div>
</div>
<script src="assets/js/app.js" defer></script>
</body>
</html>
